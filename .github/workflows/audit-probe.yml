name: Audit probe

on:
  push:
    branches: [claude/project-thread-yg4dof]
    paths: [scripts/audit_probe.py, .github/workflows/audit-probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: [dates, forfeits, playoffs]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: timeout 30m python -u scripts/audit_probe.py ${{ matrix.part }}
        env:
          PROBE_LIMIT: '120'
